version: 2.1

# ============================================================================
# Orbs
# ============================================================================
orbs:
  python: circleci/python@2.1.1

# ============================================================================
# Executors
# ============================================================================
executors:
  linux-gcc:
    docker:
      - image: cimg/base:current-22.04
    resource_class: medium
    environment:
      CC: gcc-13
      CXX: g++-13

  linux-clang:
    docker:
      - image: cimg/base:current-22.04
    resource_class: medium
    environment:
      CC: clang-17
      CXX: clang++-17

# ============================================================================
# Commands
# ============================================================================
commands:
  install-dependencies:
    description: "Install build dependencies"
    parameters:
      compiler:
        type: string
        default: "gcc"
    steps:
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              cmake \
              ninja-build \
              libpcap-dev \
              pkg-config \
              libyaml-cpp-dev \
              nlohmann-json3-dev

      - when:
          condition:
            equal: [ "gcc", << parameters.compiler >> ]
          steps:
            - run:
                name: Install GCC 13
                command: |
                  sudo apt-get install -y gcc-13 g++-13

      - when:
          condition:
            equal: [ "clang", << parameters.compiler >> ]
          steps:
            - run:
                name: Install Clang 17
                command: |
                  sudo apt-get install -y clang-17 lld-17

  configure-cmake:
    description: "Configure CMake build"
    parameters:
      build_type:
        type: string
        default: "Release"
      sanitizers:
        type: boolean
        default: false
      c_bindings:
        type: boolean
        default: false
      python_bindings:
        type: boolean
        default: false
    steps:
      - run:
          name: Configure CMake
          command: |
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=<< parameters.build_type >> \
              -DWADJET_BUILD_TESTS=ON \
              -DWADJET_BUILD_EXAMPLES=ON \
              -DWADJET_ENABLE_SANITIZERS=<< parameters.sanitizers >> \
              -DWADJET_BUILD_C_BINDINGS=<< parameters.c_bindings >> \
              -DWADJET_BUILD_PYTHON_BINDINGS=<< parameters.python_bindings >>

  build-project:
    description: "Build the project"
    steps:
      - run:
          name: Build
          command: cmake --build build --parallel $(nproc)

  run-tests:
    description: "Run tests"
    steps:
      - run:
          name: Run C++ tests
          command: |
            cd build
            ctest --output-on-failure --parallel $(nproc) || true
      - store_test_results:
          path: build/test-results

# ============================================================================
# Jobs
# ============================================================================
jobs:
  # --------------------------------------------------------------------------
  # Build & Test with GCC
  # --------------------------------------------------------------------------
  build-gcc-debug:
    executor: linux-gcc
    steps:
      - checkout
      - install-dependencies:
          compiler: "gcc"
      - configure-cmake:
          build_type: "Debug"
          sanitizers: true
      - build-project
      - run-tests
      - persist_to_workspace:
          root: .
          paths:
            - build

  build-gcc-release:
    executor: linux-gcc
    steps:
      - checkout
      - install-dependencies:
          compiler: "gcc"
      - configure-cmake:
          build_type: "Release"
          sanitizers: false
      - build-project
      - run-tests

  # --------------------------------------------------------------------------
  # Build & Test with Clang
  # --------------------------------------------------------------------------
  build-clang-debug:
    executor: linux-clang
    steps:
      - checkout
      - install-dependencies:
          compiler: "clang"
      - configure-cmake:
          build_type: "Debug"
          sanitizers: true
      - build-project
      - run-tests

  build-clang-release:
    executor: linux-clang
    steps:
      - checkout
      - install-dependencies:
          compiler: "clang"
      - configure-cmake:
          build_type: "Release"
          sanitizers: false
      - build-project
      - run-tests

  # --------------------------------------------------------------------------
  # Build with Bindings
  # --------------------------------------------------------------------------
  build-with-bindings:
    executor: linux-gcc
    steps:
      - checkout
      - install-dependencies:
          compiler: "gcc"
      - run:
          name: Install Python dependencies
          command: |
            sudo apt-get install -y python3-dev python3-pip python3-venv
            python3 -m venv .venv
            . .venv/bin/activate
            pip install pybind11 pytest
      - run:
          name: Configure with bindings
          command: |
            . .venv/bin/activate
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DWADJET_BUILD_TESTS=ON \
              -DWADJET_BUILD_EXAMPLES=ON \
              -DWADJET_ENABLE_SANITIZERS=OFF \
              -DWADJET_BUILD_C_BINDINGS=ON \
              -DWADJET_BUILD_PYTHON_BINDINGS=ON
      - build-project
      - run:
          name: Run C++ tests
          command: |
            cd build
            ctest --output-on-failure --parallel $(nproc) -E python || true
      - run:
          name: Run Python tests
          command: |
            . .venv/bin/activate
            cd bindings/python
            PYTHONPATH=../../build/bindings/python pytest tests/ -v || true

  # --------------------------------------------------------------------------
  # Lint & Format Check
  # --------------------------------------------------------------------------
  lint:
    executor: linux-gcc
    steps:
      - checkout
      - run:
          name: Install clang-format
          command: sudo apt-get update && sudo apt-get install -y clang-format-17
      - run:
          name: Check code formatting
          command: |
            find include src tests -name '*.cpp' -o -name '*.hpp' | \
              xargs clang-format-17 --dry-run --Werror

  # --------------------------------------------------------------------------
  # Static Analysis
  # --------------------------------------------------------------------------
  static-analysis:
    executor: linux-clang
    steps:
      - checkout
      - install-dependencies:
          compiler: "clang"
      - run:
          name: Install clang-tidy
          command: sudo apt-get install -y clang-tidy-17
      - run:
          name: Configure for analysis
          command: |
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DWADJET_BUILD_TESTS=ON
      - run:
          name: Run clang-tidy
          command: |
            find src include -name '*.cpp' | head -20 | \
              xargs -I{} clang-tidy-17 -p build {} || true

# ============================================================================
# Workflows
# ============================================================================
workflows:
  version: 2

  # Main CI workflow
  ci:
    jobs:
      - lint
      - build-gcc-debug:
          requires:
            - lint
      - build-gcc-release:
          requires:
            - lint
      - build-clang-debug:
          requires:
            - lint
      - build-clang-release:
          requires:
            - lint
      - build-with-bindings:
          requires:
            - build-gcc-release
      - static-analysis:
          requires:
            - lint

  # Nightly full test suite
  nightly:
    triggers:
      - schedule:
          cron: "0 2 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - build-gcc-debug
      - build-gcc-release
      - build-clang-debug
      - build-clang-release
      - build-with-bindings
      - static-analysis
