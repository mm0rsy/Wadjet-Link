version: 2.1

# ============================================================================
# Orbs
# ============================================================================
orbs:
  python: circleci/python@2.1.1

# ============================================================================
# Executors
# ============================================================================
executors:
  linux-gcc:
    docker:
      - image: cimg/base:current-22.04
    resource_class: large
    environment:
      CC: gcc-13
      CXX: g++-13

  linux-clang:
    docker:
      - image: cimg/base:current-22.04
    resource_class: large
    environment:
      CC: clang-17
      CXX: clang++-17

# ============================================================================
# Commands
# ============================================================================
commands:
  install-dependencies:
    description: "Install build dependencies"
    parameters:
      compiler:
        type: string
        default: "gcc"
    steps:
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              cmake \
              ninja-build \
              libpcap-dev \
              pkg-config \
              libyaml-cpp-dev \
              nlohmann-json3-dev \
              protobuf-compiler

      - when:
          condition:
            equal: [ "gcc", << parameters.compiler >> ]
          steps:
            - run:
                name: Install GCC 13
                command: |
                  # Add Ubuntu Toolchain PPA for GCC 13
                  sudo apt-get install -y software-properties-common
                  sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
                  sudo apt-get update
                  sudo apt-get install -y gcc-13 g++-13

      - when:
          condition:
            equal: [ "clang", << parameters.compiler >> ]
          steps:
            - run:
                name: Install Clang 17
                command: |
                  # Add LLVM APT repository for Clang 17
                  wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
                  echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" | sudo tee /etc/apt/sources.list.d/llvm-17.list
                  sudo apt-get update
                  sudo apt-get install -y clang-17 lld-17

  configure-cmake:
    description: "Configure CMake build"
    parameters:
      build_type:
        type: string
        default: "Release"
      sanitizers:
        type: boolean
        default: false
      c_bindings:
        type: boolean
        default: false
      python_bindings:
        type: boolean
        default: false
    steps:
      - run:
          name: Clean previous build artifacts
          command: |
            rm -rf build
      - run:
          name: Configure CMake
          command: |
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=<< parameters.build_type >> \
              -DWADJET_BUILD_TESTS=ON \
              -DWADJET_BUILD_EXAMPLES=ON \
              -DWADJET_ENABLE_DISTRIBUTED=ON \
              -DWADJET_ENABLE_SANITIZERS=<< parameters.sanitizers >> \
              -DWADJET_BUILD_C_BINDINGS=<< parameters.c_bindings >> \
              -DWADJET_BUILD_PYTHON_BINDINGS=<< parameters.python_bindings >>

  build-project:
    description: "Build the project"
    steps:
      - run:
          name: Build
          command: cmake --build build --parallel 4

  run-unit-tests:
    description: "Run unit tests"
    steps:
      - run:
          name: Run unit tests
          command: |
            cd build
            ./tests/wadjet_tests --gtest_output=xml:test-results/unit-tests.xml
      - store_test_results:
          path: build/test-results

  run-protocol-tests:
    description: "Run protocol decoder tests"
    parameters:
      filter:
        type: string
        default: "*"
    steps:
      - run:
          name: Run protocol tests (<< parameters.filter >>)
          command: |
            cd build
            ./tests/wadjet_tests --gtest_filter="<< parameters.filter >>" --gtest_output=xml:test-results/protocol-tests.xml
      - store_test_results:
          path: build/test-results

  run-integration-tests:
    description: "Run integration tests"
    steps:
      - run:
          name: Run integration tests
          command: |
            cd build
            ./tests/wadjet_integration_tests --gtest_output=xml:test-results/integration-tests.xml || true
      - store_test_results:
          path: build/test-results

  run-testing-framework-tests:
    description: "Run testing framework tests"
    steps:
      - run:
          name: Run testing framework tests
          command: |
            cd build
            ./tests/wadjet_testing_framework_tests --gtest_output=xml:test-results/testing-framework-tests.xml || true
      - store_test_results:
          path: build/test-results

  run-scenario-tests:
    description: "Run scenario tests"
    steps:
      - run:
          name: Run scenario tests
          command: |
            cd build
            if [ -f ./tests/wadjet_scenario_tests ]; then
              ./tests/wadjet_scenario_tests --gtest_output=xml:test-results/scenario-tests.xml
            else
              echo "Scenario tests not built"
            fi
      - store_test_results:
          path: build/test-results

  run-performance-tests:
    description: "Run performance regression tests"
    steps:
      - run:
          name: Run performance tests
          command: |
            cd build
            ./tests/wadjet_tests --gtest_filter="*Performance*:*Benchmark*" --gtest_output=xml:test-results/performance-tests.xml
      - store_test_results:
          path: build/test-results

  run-distributed-tests:
    description: "Run distributed testing infrastructure tests"
    steps:
      - run:
          name: Run distributed unit tests
          command: |
            cd build
            if [ -f ./tests/wadjet_distributed_tests ]; then
              ./tests/wadjet_distributed_tests --gtest_output=xml:test-results/distributed-unit-tests.xml
            else
              echo "Distributed tests not built"
            fi
      - store_test_results:
          path: build/test-results

  run-distributed-integration-tests:
    description: "Run distributed testing integration tests"
    steps:
      - run:
          name: Run distributed integration tests
          command: |
            cd build
            if [ -f ./tests/wadjet_integration_tests ]; then
              ./tests/wadjet_integration_tests --gtest_filter="*[Dd]istributed*" --gtest_output=xml:test-results/distributed-integration-tests.xml || true
            else
              echo "Integration tests not built"
            fi
      - store_test_results:
          path: build/test-results

# ============================================================================
# Jobs
# ============================================================================
jobs:
  # --------------------------------------------------------------------------
  # Lint & Format Check
  # --------------------------------------------------------------------------
  lint:
    executor: linux-gcc
    steps:
      - checkout
      - run:
          name: Install clang-format
          command: |
            # Add LLVM APT repository for clang-format-18
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
            echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
            sudo apt-get update
            sudo apt-get install -y clang-format-18
      - run:
          name: Check code formatting
          command: |
            find include src tests -name '*.cpp' -o -name '*.hpp' | \
              xargs clang-format-18 --dry-run --Werror

  # --------------------------------------------------------------------------
  # Build Jobs (GCC)
  # --------------------------------------------------------------------------
  build-gcc-debug:
    executor: linux-gcc
    steps:
      - checkout
      - install-dependencies:
          compiler: "gcc"
      - configure-cmake:
          build_type: "Debug"
          sanitizers: true
      - build-project
      - persist_to_workspace:
          root: .
          paths:
            - build
            - include
            - pcap_samples

  build-gcc-release:
    executor: linux-gcc
    steps:
      - checkout
      - install-dependencies:
          compiler: "gcc"
      - configure-cmake:
          build_type: "Release"
          sanitizers: false
      - build-project
      - persist_to_workspace:
          root: .
          paths:
            - build
            - include
            - pcap_samples

  # --------------------------------------------------------------------------
  # Build Jobs (Clang)
  # --------------------------------------------------------------------------
  build-clang-debug:
    executor: linux-clang
    steps:
      - checkout
      - install-dependencies:
          compiler: "clang"
      - configure-cmake:
          build_type: "Debug"
          sanitizers: true
      - build-project
      - persist_to_workspace:
          root: .
          paths:
            - build
            - include
            - pcap_samples

  build-clang-release:
    executor: linux-clang
    steps:
      - checkout
      - install-dependencies:
          compiler: "clang"
      - configure-cmake:
          build_type: "Release"
          sanitizers: false
      - build-project
      - persist_to_workspace:
          root: .
          paths:
            - build
            - include
            - pcap_samples

  # --------------------------------------------------------------------------
  # Unit Test Jobs
  # --------------------------------------------------------------------------
  test-unit-gcc-debug:
    executor: linux-gcc
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-unit-tests

  test-unit-clang-debug:
    executor: linux-clang
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-unit-tests

  # --------------------------------------------------------------------------
  # Protocol Test Jobs (Split by protocol stack)
  # --------------------------------------------------------------------------
  test-protocols-network-gcc:
    executor: linux-gcc
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-protocol-tests:
          filter: "*IPv4*:*Tcp*:*Udp*:*Ethernet*"

  test-protocols-automotive-gcc:
    executor: linux-gcc
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-protocol-tests:
          filter: "*SomeIp*:*DoIP*:*Uds*:*Gptp*:*Dds*:*Rtps*"

  test-protocols-network-clang:
    executor: linux-clang
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-protocol-tests:
          filter: "*IPv4*:*Tcp*:*Udp*:*Ethernet*"

  test-protocols-automotive-clang:
    executor: linux-clang
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-protocol-tests:
          filter: "*SomeIp*:*DoIP*:*Uds*:*Gptp*:*Dds*:*Rtps*"

  # --------------------------------------------------------------------------
  # Integration Test Jobs
  # --------------------------------------------------------------------------
  test-integration-gcc:
    executor: linux-gcc
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-integration-tests

  test-integration-clang:
    executor: linux-clang
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-integration-tests

  # --------------------------------------------------------------------------
  # Testing Framework Test Jobs
  # --------------------------------------------------------------------------
  test-framework-gcc:
    executor: linux-gcc
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-testing-framework-tests

  # --------------------------------------------------------------------------
  # Scenario Test Jobs
  # --------------------------------------------------------------------------
  test-scenario-gcc:
    executor: linux-gcc
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-scenario-tests

  # --------------------------------------------------------------------------
  # Distributed Testing Test Jobs
  # --------------------------------------------------------------------------
  test-distributed-gcc:
    executor: linux-gcc
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-distributed-tests

  test-distributed-clang:
    executor: linux-clang
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-distributed-tests

  test-distributed-integration-gcc:
    executor: linux-gcc
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-distributed-integration-tests

  test-distributed-integration-clang:
    executor: linux-clang
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-distributed-integration-tests

  # --------------------------------------------------------------------------
  # Performance Test Jobs (Nightly)
  # --------------------------------------------------------------------------
  test-performance-gcc:
    executor: linux-gcc
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run-performance-tests

  # --------------------------------------------------------------------------
  # Build with Bindings
  # --------------------------------------------------------------------------
  build-with-bindings:
    executor: linux-gcc
    steps:
      - checkout
      - install-dependencies:
          compiler: "gcc"
      - run:
          name: Install Python dependencies
          command: |
            sudo apt-get install -y python3-dev python3-pip python3-venv
            python3 -m venv .venv
            . .venv/bin/activate
            pip install pybind11 pytest
      - run:
          name: Configure with bindings
          command: |
            . .venv/bin/activate
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DWADJET_BUILD_TESTS=ON \
              -DWADJET_BUILD_EXAMPLES=ON \
              -DWADJET_ENABLE_SANITIZERS=OFF \
              -DWADJET_BUILD_C_BINDINGS=ON \
              -DWADJET_BUILD_PYTHON_BINDINGS=ON
      - build-project
      - persist_to_workspace:
          root: .
          paths:
            - build
            - bindings
            - .venv

  test-bindings-cpp:
    executor: linux-gcc
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run C++ binding tests
          command: |
            cd build
            ctest --output-on-failure --parallel $(nproc) -E python || true
      - store_test_results:
          path: build/test-results

  test-bindings-python:
    executor: linux-gcc
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run Python binding tests
          command: |
            . .venv/bin/activate
            cd bindings/python
            PYTHONPATH=../../build/bindings/python pytest tests/ -v --junitxml=../../build/test-results/python-tests.xml || true
      - store_test_results:
          path: build/test-results

  # --------------------------------------------------------------------------
  # Static Analysis
  # --------------------------------------------------------------------------
  static-analysis:
    executor: linux-clang
    steps:
      - checkout
      - install-dependencies:
          compiler: "clang"
      - run:
          name: Install clang-tidy
          command: |
            # Add LLVM APT repository for clang-tidy-17
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
            echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" | sudo tee /etc/apt/sources.list.d/llvm-17.list
            sudo apt-get update
            sudo apt-get install -y clang-tidy-17
      - run:
          name: Configure for analysis
          command: |
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DWADJET_ENABLE_DISTRIBUTED=ON \
              -DWADJET_BUILD_EXAMPLES=OFF \
              -DWADJET_BUILD_TESTS=OFF
      - run:
          name: Run clang-tidy
          command: |
            find src include -name '*.cpp' | head -20 | \
              xargs -I{} clang-tidy-17 -p build {} || true

# ============================================================================
# Workflows
# ============================================================================
workflows:
  # Main CI workflow
  ci:
    when:
      not:
        equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
    jobs:
      # Stage 1: Lint
      - lint

      # Stage 2: Build (GCC only, Clang is manual)
      - build-gcc-debug:
          requires:
            - lint

      # Stage 3: Unit Tests (GCC only, Clang is manual)
      - test-unit-gcc-debug:
          requires:
            - build-gcc-debug

      # Stage 4: Protocol Tests (GCC only, Clang is manual)
      - test-protocols-network-gcc:
          requires:
            - build-gcc-debug
      - test-protocols-automotive-gcc:
          requires:
            - build-gcc-debug

      # Stage 5: Integration Tests (GCC only, Clang is manual)
      - test-integration-gcc:
          requires:
            - test-unit-gcc-debug
            - test-protocols-network-gcc
            - test-protocols-automotive-gcc

      # Stage 6: Testing Framework & Scenario Tests
      - test-framework-gcc:
          requires:
            - build-gcc-debug
      - test-scenario-gcc:
          requires:
            - build-gcc-debug

      # Stage 7: Distributed Testing Tests (GCC only, Clang is manual)
      - test-distributed-gcc:
          requires:
            - build-gcc-debug
      - test-distributed-integration-gcc:
          requires:
            - test-distributed-gcc

      # Stage 8: Static Analysis (parallel with tests)
      - static-analysis:
          requires:
            - lint

  # Release build workflow (runs on main/master merges)
  release:
    when:
      not:
        equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
    jobs:
      - build-gcc-release:
          filters:
            branches:
              only:
                - master
                - main
      - build-with-bindings:
          requires:
            - build-gcc-release
          filters:
            branches:
              only:
                - master
                - main
      - test-bindings-cpp:
          requires:
            - build-with-bindings
          filters:
            branches:
              only:
                - master
                - main
      - test-bindings-python:
          requires:
            - build-with-bindings
          filters:
            branches:
              only:
                - master
                - main

  # Nightly full test suite
  nightly:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ "nightly", << pipeline.schedule.name >> ]
    jobs:
      # Full build matrix (GCC only, Clang is manual)
      - build-gcc-debug
      - build-gcc-release

      # All unit tests (GCC only, Clang is manual)
      - test-unit-gcc-debug:
          requires:
            - build-gcc-debug

      # All protocol tests (GCC only, Clang is manual)
      - test-protocols-network-gcc:
          requires:
            - build-gcc-debug
      - test-protocols-automotive-gcc:
          requires:
            - build-gcc-debug

      # All integration tests (GCC only, Clang is manual)
      - test-integration-gcc:
          requires:
            - build-gcc-debug

      # Testing framework tests
      - test-framework-gcc:
          requires:
            - build-gcc-debug

      # Scenario tests
      - test-scenario-gcc:
          requires:
            - build-gcc-debug

      # Distributed testing tests (GCC only, Clang is manual)
      - test-distributed-gcc:
          requires:
            - build-gcc-debug
      - test-distributed-integration-gcc:
          requires:
            - test-distributed-gcc

      # Performance tests (nightly only)
      - test-performance-gcc:
          requires:
            - build-gcc-release

      # Bindings
      - build-with-bindings:
          requires:
            - build-gcc-release
      - test-bindings-cpp:
          requires:
            - build-with-bindings
      - test-bindings-python:
          requires:
            - build-with-bindings

      # Static analysis
      - static-analysis
