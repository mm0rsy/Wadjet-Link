[package]
name = "wadjet-distributed"
version = "0.1.0"
edition = "2021"
authors = ["Wadjet-Link Contributors"]
license = "Polyform-Noncommercial-1.0.0"
description = "Rust bindings for Wadjet-Link distributed packet capture and testing"
repository = "https://github.com/mm0rsy/Wadjet-Link"
homepage = "https://github.com/mm0rsy/Wadjet-Link"

[dependencies]
libc = "0.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[[test]]
name = "integration"
path = "tests/integration.rs"

[lib]
name = "wadjet_distributed"
path = "src/lib.rs"
crate-type = ["rlib", "dylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

# FFI bindings to C Wadjet library
[build-dependencies]
pkg-config = "0.3"
