[package]
name = "wadjet"
version = "0.1.0"
edition = "2021"
authors = ["Mohamed Morsy"]
description = "Safe Rust bindings for Wadjet-Link automotive network capture library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xvredebreuk/Wadjet-Link"
documentation = "https://docs.rs/wadjet"
keywords = ["automotive", "ethernet", "capture", "someip", "doip"]
categories = ["network-programming", "hardware-support"]
readme = "../README.md"

[dependencies]
wadjet-sys = { path = "../wadjet-sys", version = "0.1.0" }
thiserror = "1.0"
bitflags = "2.0"

[dev-dependencies]
tempfile = "3.0"

[features]
default = []
